services:
  sync:
    build: .
    env_file: .env

  ofelia:
    image: mcuadros/ofelia:0.3.22
    command: daemon --docker -f label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Asia/Tokyo}
    labels:
      ofelia.job-run.sync.schedule: "${OFELIA_SCHEDULE:-@hourly}"
      ofelia.job-run.sync.container: "${COMPOSE_PROJECT_NAME}-sync-1"
      ofelia.job-run.sync.no-overlap: "true"
